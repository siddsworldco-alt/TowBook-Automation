services:
  scraper:
    build: ./scraper
    container_name: towbook-scraper
    restart: unless-stopped
    env_file: .env
    environment:
      - N8N_PROGRESS_WEBHOOK_URL=http://n8n:5678/webhook/scraper-progress
    ports:
      - "5050:5050"
    volumes:
      - scraper_output:/app/output
      - ./contacts.csv:/app/output/contacts.csv:ro
    shm_size: '2gb'
    networks:
      - towbook-net

  n8n:
    image: n8nio/n8n:latest
    container_name: towbook-n8n
    restart: unless-stopped
    # No ports here, only exposed via Caddy
    env_file: .env
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_ADMIN_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_ADMIN_PASSWORD:-changeme123}
      - N8N_SECURE_COOKIE=false
      - GENERIC_TIMEZONE=Pacific/Auckland
      - TZ=Pacific/Auckland
      - WEBHOOK_URL=https://n8n.fractio.services
      - N8N_EDITOR_BASE_URL=https://n8n.fractio.services
    volumes:
      - n8n_data:/home/node/.n8n
      - scraper_output:/app/output
    networks:
      - towbook-net
    depends_on:
      - scraper

  caddy:
    image: caddy:latest
    container_name: towbook-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - towbook-net
    depends_on:
      - n8n

volumes:
  n8n_data:
  scraper_output:
  caddy_data:
  caddy_config:

networks:
  towbook-net:
    driver: bridge
