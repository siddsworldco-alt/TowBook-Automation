version: "3.8"

services:
  scraper:
    build: ./scraper
    container_name: towbook-scraper
    restart: unless-stopped
    env_file: .env
    environment:
      - N8N_PROGRESS_WEBHOOK_URL=http://n8n:5678/webhook/scraper-progress
    ports:
      - "5050:5050"
    volumes:
      - scraper_output:/app/output
    shm_size: '2gb'
    networks:
      - towbook-net

  n8n:
    image: n8nio/n8n:latest
    container_name: towbook-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    env_file: .env
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_ADMIN_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_ADMIN_PASSWORD:-changeme123}
      - N8N_SECURE_COOKIE=false
      - GENERIC_TIMEZONE=Pacific/Auckland
      - TZ=Pacific/Auckland
    volumes:
      - n8n_data:/home/node/.n8n
      - scraper_output:/app/output
    networks:
      - towbook-net
    depends_on:
      - scraper

volumes:
  n8n_data:
  scraper_output:

networks:
  towbook-net:
    driver: bridge
